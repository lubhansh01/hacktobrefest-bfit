# Render Blueprint for the mail API. The frontend deploys elsewhere
# (Vercel/Netlify/Pages) — this file only describes the backend.
services:
  - type: web
    name: hacktoberfest-dehradun-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Render injects PORT itself; server.ts reads it.

      # sync:false = Render prompts for the value and keeps it out of the repo.
      - key: CORS_ORIGIN      # frontend origin, e.g. https://your-app.vercel.app
        sync: false
      - key: APP_URL          # public frontend URL, used in email links
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Hacktoberfest Dehradun Team
